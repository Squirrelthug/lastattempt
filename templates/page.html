{% extends "base.html" %}
{% set title = page.title %}
{% set description = page.description %}
{% block content %}
<div class="wrap">
  <header class="page-head">
    {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </header>
  <div class="prose" style="padding-bottom:3rem">
    {{ page.body_html|safe }}
  </div>
</div>
{% endblock %}
