name: Refresh feed data

# Cloudflare builds and deploys the site itself on every push (Git integration).
# This workflow only keeps the cached podcast feed and Raider.IO data fresh:
# twice a day it rebuilds, and if the cached data changed it commits it, which
# triggers a Cloudflare deploy. No Cloudflare secrets needed.

on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rebuild (fetches feed + Raider.IO)
        run: python build.py
      - name: Commit refreshed data if it changed
        run: |
          git config user.name "lastattempt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh feed and guild data"
            git push
          fi
